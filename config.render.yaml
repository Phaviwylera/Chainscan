# Config used by the Render web service. RPC URLs come from environment variables; an entry whose
# variable is not set is skipped, so the public fallbacks below keep it working with no keys at all.
#   ALCHEMY_KEY, ALCHEMY_KEY_2    Alchemy keys; each is used for every chain enabled in its Alchemy app
#   <CHAIN>_RPC_URL, <CHAIN>_RPC_URL_2   extra providers per chain (QuickNode, Chainstack, dRPC, own node)
#                                 CHAIN = ETH, BSC, BASE, POLYGON, ARB, OP, AVAX
#   BTC_ESPLORA_URL               your own electrs/mempool API, e.g. https://btc.example.com/api
#   BTC_SNAPSHOT_PATH             UTXO dump on the disk, e.g. /data/utxo.csv (switch btc.mode to snapshot)
#
# Batches start large (up to 6,000 wallets per call: fewer calls means more wallets per unit of a
# provider's rate limit). Each endpoint learns the largest batch it accepts, so a public RPC with a
# small gas cap gets smaller batches without shrinking them for Alchemy. Every token address here
# was checked against the issuer or an explorer and passes its EIP-55 checksum at startup.
ingest:
  workers: 0
  chunk_mb: 32
progress_every_s: 2

chains:
  eth:
    name: Ethereum
    explorer: https://etherscan.io/address/
    gas_budget: 120000000
    max_addresses_per_call: 6000
    rpcs:
      - {url: "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}", max_concurrency: 48}
      - {url: "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY_2}", max_concurrency: 48}
      - {url: "${ETH_RPC_URL}", max_concurrency: 48}
      - {url: "${ETH_RPC_URL_2}", max_concurrency: 48}
      - {url: "https://ethereum-rpc.publicnode.com", max_concurrency: 8}
      - {url: "https://eth.drpc.org", max_concurrency: 4}
      - {url: "https://eth.llamarpc.com", max_concurrency: 4}
      - {url: "https://1rpc.io/eth", max_concurrency: 3}
